<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora · Daniel Corado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="alien">

  <!-- ===== BARRA LATERAL ===== -->
  <aside class="rail">
    <div class="rail-top">
      <div class="mascota">
        <img src="images.jpg" alt="Mascota perrito alienígena" class="mascota-img">
        <span class="antena antena-l"></span>
        <span class="antena antena-r"></span>
      </div>
      <h1 class="marca">Bitácora<span>Tecnología</span></h1>
      <p class="autor">Daniel Corado</p>
    </div>

    <nav class="semanas" id="listaSemanas" aria-label="Semanas de la bitácora">
      <!-- generado por script.js -->
    </nav>

    <div class="rail-bottom">
      <p class="pista">Elige una semana para ver su contenido →</p>
    </div>
  </aside>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <div class="escenario">

    <header class="topbar">
      <div class="topbar-info">
        <span class="ojo"></span>
        <span id="tituloActivo">Selecciona una semana</span>
      </div>

      <div class="selector-tema" role="group" aria-label="Selector de color de tema">
        <span class="selector-etiqueta">Tema</span>
        <button class="swatch" data-theme="alien" style="--sw:#A8D24D" title="Verde alien"></button>
        <button class="swatch" data-theme="cosmico" style="--sw:#6E9CFF" title="Azul cósmico"></button>
        <button class="swatch" data-theme="plasma" style="--sw:#FF6E9C" title="Rosa plasma"></button>
        <button class="swatch" data-theme="eclipse" style="--sw:#B78CFF" title="Violeta eclipse"></button>
      </div>
