<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Godoy Alexander</title>
    <style>
        html, body{
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        body{
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        header{
            padding: 20px;
            background-color: rgba(54, 14, 110, 0.913);
        }
        main{
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgb(79, 86, 86);
        }
        main{
            flex: 1;
            padding: 20px;
        }
        main h4 {
            color: #fff; /* Color del texto (blanco para que resalte) */
            text-transform: uppercase;
            letter-spacing: 2px;
            /* El truco del neón: varias sombras azules con distinto nivel de desenfoque */
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #00d2ff,
                0 0 40px #00d2ff,
                0 0 80px #00d2ff;
        }
        footer{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-top: 1px solid rgb(193, 208, 100);
            background-color: rgb(38, 71, 71);
        }
    </style>
</head>
<body>
    <header>
        <h1>Bitácora Segunda y Tercera Unidad</h1>
    </header>
    <main>
        <h4>Contenido Pagina WEB</h4>
    </main>
    <footer>
        <span>@AleGod0229</span>
        <img src="https://www.capouilliez.edu.gt/assets/img/logo.png" height="25" width="100">
    </footer>
</body>
</html>
